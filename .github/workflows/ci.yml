  clearpath_common_src_ci:
    name: Jazzy Clearpath Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - uses: ros-tooling/action-ros-ci@v0.3
        id: action_ros_ci_step
        continue-on-error: true
        env:
          AMENT_PREFIX_PATH: /opt/ros/jazzy
          CMAKE_PREFIX_PATH: /opt/ros/jazzy/opt/sdformat_vendor:/opt/ros/jazzy/opt/gz_math_vendor:/opt/ros/jazzy/opt/gz_utils_vendor:/opt/ros/jazzy/opt/gz_tools_vendor:/opt/ros/jazzy/opt/gz_cmake_vendor
          GAZEBO_MODEL_PATH: /opt/ros/jazzy/share/GAZEBO_MODEL_PATH=/opt/ros/jazzy/share/
          GZ_CONFIG_PATH: /opt/ros/jazzy/opt/sdformat_vendor/share/gz
          LD_LIBRARY_PATH: /opt/ros/jazzy/opt/sdformat_vendor/lib:/opt/ros/jazzy/opt/rviz_ogre_vendor/lib:/opt/ros/jazzy/lib/x86_64-linux-gnu:/opt/ros/jazzy/opt/gz_math_vendor/lib:/opt/ros/jazzy/opt/gz_utils_vendor/lib:/opt/ros/jazzy/opt/gz_tools_vendor/lib:/opt/ros/jazzy/opt/gz_cmake_vendor/lib:/opt/ros/jazzy/lib
          PATH: /opt/ros/jazzy/opt/gz_tools_vendor/bin:/opt/ros/jazzy/bin:/home/runner/work/clearpath_common/clearpath_common/ros_ws/install/bin:/snap/bin:/home/runner/.local/bin:/opt/pipx_bin:/home/runner/.cargo/bin:/home/runner/.config/composer/vendor/bin:/usr/local/.ghcup/bin:/home/runner/.dotnet/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin
          PYTHONPATH: /opt/ros/jazzy/lib/python3.12/site-packages
          ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
          ROS_DISTRO: jazzy
          ROS_PYTHON_VERSION: 3
          ROS_VERSION: 2
        with:
          target-ros2-distro: jazzy
          package-name: |
            clearpath_common
            clearpath_control
            clearpath_customization
            clearpath_description
            clearpath_diagnostics
            clearpath_generator_common
            clearpath_mounts_description
            clearpath_platform_description
            clearpath_sensors_description
      - name: Install again
        continue-on-error: true
        run: sudo apt-get install ros-jazzy-ament-package
      - name: Test ament_cmake_core
        continue-on-error: true
        run: source /opt/ros/jazzy/setup.bash && python3 /opt/ros/jazzy/share/ament_cmake_core/cmake/package_templates/templates_2_cmake.py
      - name: Print out all installed packages
        continue-on-error: true
        run: dpkg --list
      - name: Print out ament_package
        continue-on-error: true
        run: ls -al /opt/ros/jazzy/lib/python3.12/site-packages/ament_package
      # - name: Build workspace with parameters
      #   continue-on-error: true
      #   run: source /opt/ros/jazzy/setup.bash && cd /home/runner/work/clearpath_common/clearpath_common/ros_ws/ && colcon build --packages-up-to clearpath_common clearpath_control clearpath_customization clearpath_description clearpath_diagnostics clearpath_generator_common clearpath_mounts_description clearpath_platform_description clearpath_sensors_description --event-handlers=console_cohesion+ --symlink-install
      - name: Just build descriptions
        continue-on-error: true
        run: source /opt/ros/jazzy/setup.bash && cd /home/runner/work/clearpath_common/clearpath_common/ros_ws/ && colcon build --packages-select clearpath_mounts_description clearpath_manipulators_description clerpath_platform_description clearpath_sensors_description
      - name: Build up to clearpath_diagnostics
        continue-on-error: true
        run: source /opt/ros/jazzy/setup.bash && cd /home/runner/work/clearpath_common/clearpath_common/ros_ws/ && colcon build --packages-up-to clearpath_diagnostics
      - name: Build up to clearpath_manipulators
        continue-on-error: true
        run: source /opt/ros/jazzy/setup.bash && cd /home/runner/work/clearpath_common/clearpath_common/ros_ws/ && colcon build --packages-up-to clearpath_manipulators
      - name: Build up to clearpath_control
        run: source /opt/ros/jazzy/setup.bash && cd /home/runner/work/clearpath_common/clearpath_common/ros_ws/ && colcon build --packages-up-to clearpath_control

