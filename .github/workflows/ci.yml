  clearpath_common_src_head_ci:
    name: Jazzy Clearpath Source with Head Branch
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
    steps:
      - uses: actions/checkout@v3
      - uses: actions/checkout@v3
        with:
          repository: clearpathrobotics/repos-dep-update-action
          ref: fix/remove-echo-e
          path: repos-dep-update-action
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y jq git python3 python3-pip
          python3 -m pip install yq --break-system-packages
      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch
      - name: Use repos update action
        uses: ./repos-dep-update-action/
        with:
          branch: ${{ steps.extract_branch.outputs.branch }}
          input: dependencies.repos
          output: updated_dependencies.repos
      - name: Updated dependencies
        run: |
          cat updated_dependencies.repos
      - name: Install vcs
        run: |
          ls -l
          apt-get update && apt-get install curl -y
          export ROS_APT_SOURCE_VERSION=$(curl -s https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest | grep -F "tag_name" | awk -F\" '{print $4}')
          curl -L -o /tmp/ros2-apt-source.deb "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.$(. /etc/os-release && echo ${UBUNTU_CODENAME:-${VERSION_CODENAME}})_all.deb"
          dpkg -i /tmp/ros2-apt-source.deb
          apt-get update
          apt-get install -y python3-vcstool python3-vcstools
      - name: Diff
        continue-on-error: true
        run: |
          diff dependencies.repos updated_dependencies.repos -y
      - name: Import dependencies.yaml
        run: |
          rm -rf src
          mkdir src
          vcs import --force --recursive src/ --input file:///__w/clearpath_common/clearpath_common/dependencies.repos
      - name: Import updated_dependencies.yaml from dependencies.yaml
        run: |
          rm -rf src
          mkdir src
          cat updated_dependencies.repos > dependencies.repos
          vcs import --force --recursive src/ --input file:///__w/clearpath_common/clearpath_common/dependencies.repos
      - name: Import updated_dependencies.yaml
        continue-on-error: true
        run: |
          rm -rf src
          mkdir src
          vcs import --force --recursive src/ --input file:///__w/clearpath_common/clearpath_common/updated_dependencies.repos
