controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ${name}_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

${name}_joint_trajectory_controller:
  ros__parameters:
    joints:
      - ${name}_fr3_joint1
      - ${name}_fr3_joint2
      - ${name}_fr3_joint3
      - ${name}_fr3_joint4
      - ${name}_fr3_joint5
      - ${name}_fr3_joint6
      - ${name}_fr3_joint7
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      ${name}_fr3_joint1: { p: 600., d: 30., i: 0., i_clamp: 1. }
      ${name}_fr3_joint2: { p: 600., d: 30., i: 0., i_clamp: 1. }
      ${name}_fr3_joint3: { p: 600., d: 30., i: 0., i_clamp: 1. }
      ${name}_fr3_joint4: { p: 600., d: 30., i: 0., i_clamp: 1. }
      ${name}_fr3_joint5: { p: 250., d: 10., i: 0., i_clamp: 1. }
      ${name}_fr3_joint6: { p: 150., d: 10., i: 0., i_clamp: 1. }
      ${name}_fr3_joint7: { p: 50., d: 5., i: 0., i_clamp: 1. }
